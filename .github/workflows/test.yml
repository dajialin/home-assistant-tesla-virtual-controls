name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "homeassistant==2026.8.3" \
            "tesla-fleet-api==1.7.6" \
            "ruff==0.16.4"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile integration
        run: python -m compileall -q custom_components/tesla_virtual_hvac

      - name: Lint
        run: ruff check custom_components/tesla_virtual_hvac tests

      - name: Check formatting
        run: ruff format --check custom_components/tesla_virtual_hvac tests
